<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <p style ="justify-content:center">Saif Eqbal</p>
<title>لا اله الا الله محمد رسول الله</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arabic Typesetting', 'Simplified Arabic', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shahada {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shahada h1 {
            font-size: 3.5rem;
            color: #1e3c72;
            margin-bottom: 30px;
            font-weight: bold;
            line-height: 1.4;
            letter-spacing: 2px;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from {
                text-shadow: 0 0 20px rgba(30, 60, 114, 0.3);
            }
            to {
                text-shadow: 0 0 40px rgba(30, 60, 114, 0.6);
            }
        }

        .translation {
            font-size: 1.3rem;
            color: #555;
            margin: 30px 0;
            font-style: italic;
            line-height: 1.6;
        }

        .divider {
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #2a5298, transparent);
            margin: 30px auto;
            border-radius: 2px;
        }

        .description {
            font-size: 1rem;
            color: #666;
            line-height: 1.8;
            margin: 30px 0;
        }

        .islamic-art {
            margin-top: 40px;
            font-size: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .stars {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }

        .footer {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .footer p {
            margin: 10px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .shahada h1 {
                font-size: 2.5rem;
            }

            .shahada {
                padding: 40px 25px;
            }

            .translation {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .shahada h1 {
                font-size: 1.8rem;
            }

            .shahada {
                padding: 30px 20px;
            }

            .translation {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Stars -->
    <script>
        function createStars() {
            const body = document.body;
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'stars';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                body.appendChild(star);
            }
        }
        createStars();
    </script>

    <div class="container">

        <div class="shahada">
            <h1>لا اله الا الله محمد رسول الله</h1>
            
            <div class="divider"></div>
            
            <p class="translation">
                "There is no god but Allah, and Muhammad is the Messenger of Allah"
            </p>

            <div class="divider"></div>

          

            <div class="islamic-art">
                ☪️ ✨ ☪️
            </div>
        </div>

        <div class="footer">
            <p>السلام عليكم ورحمة الله وبركاته</p>
            <p>Peace be upon you and the mercy and blessings of Allah</p>
        </div>
    </div>
</body>
</html>
